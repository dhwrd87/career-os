name: Career OS validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ensure PDF rendering dependency
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          pdftoppm -v
      - name: Prepare release build tools
        run: python -m pip install --upgrade pip "setuptools>=77"
      - run: python -m pip install ".[resume,docx,dev,test]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_release.py --output "$RUNNER_TEMP/release"
      - run: python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/release/*.whl
      - run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/e2e/run_installed_wheel_matrix.py" --runtime-root "$RUNNER_TEMP/personas" --fixture-root "$GITHUB_WORKSPACE/fixtures/synthetic/onboarding-matrix" --output "$RUNNER_TEMP/personas.json"
