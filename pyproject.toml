[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "career-os"
version = "0.4.3"
description = "Find jobs, prepare applications, and plan your career with AI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Career OS Maintainers"}]
keywords = ["career", "resume", "provenance", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business"
]
dependencies = []

[project.optional-dependencies]
resume = [
  "reportlab>=4.4,<5",
  "pypdf>=6,<7",
  "pdfplumber>=0.11,<0.12",
  "Pillow>=12,<13"
]
docx = ["python-docx>=1.1,<2"]
dev = ["build>=1.2,<2", "twine>=5,<7"]
test = ["coverage>=7,<8"]

[project.scripts]
careeros = "careeros.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"careeros.schemas" = ["*.schema.json", "registry.v1.json"]
"careeros.questionnaires" = ["*.json"]
